# B7.14 (James-ruled, monthly): compare the committed Cloudflare edge ranges
# (src/lib/http/cloudflare-ranges.ts, the trust boundary for cf-connecting-ip)
# with the published lists. A difference opens an issue; nothing is committed.
name: Cloudflare ranges

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Published ranges match the committed constants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compare with the published lists
        id: compare
        run: npx tsx scripts/check-cloudflare-ranges.ts 2>&1 | tee compare.log

      - name: Open an issue when the ranges changed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('compare.log') ? fs.readFileSync('compare.log', 'utf8') : '(no output)';
            const title = 'Cloudflare ranges changed';
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'cloudflare-ranges' });
            if (open.data.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['cloudflare-ranges'],
              body: `The published Cloudflare edge ranges differ from src/lib/http/cloudflare-ranges.ts (RENA-002 trust boundary). Refresh them in a sanctioned gate.\n\n\`\`\`\n${body}\n\`\`\``,
            });
