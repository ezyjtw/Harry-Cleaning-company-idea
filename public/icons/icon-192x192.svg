<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="30" fill="#111111"/>
  <!-- Water droplet -->
  <defs>
    <linearGradient id="dropGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60c5f7"/>
      <stop offset="50%" stop-color="#1a7fb5"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#90ddfb" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a7fb5" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Main droplet shape -->
  <path d="M96 30 C96 30 60 85 60 115 C60 140 75 155 96 155 C117 155 132 140 132 115 C132 85 96 30 96 30Z" fill="url(#dropGrad)"/>
  <!-- Inner highlight -->
  <path d="M96 40 C96 40 72 88 72 113 C72 132 82 145 96 145 C96 145 80 135 80 113 C80 88 96 40 96 40Z" fill="url(#highlight)"/>
  <!-- Sparkle -->
  <g transform="translate(110, 42)" fill="white">
    <line x1="0" y1="-7" x2="0" y2="7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-4" y1="-4" x2="4" y2="4" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <line x1="4" y1="-4" x2="-4" y2="4" stroke="white" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
